<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80">
  <title>Dash — Data Network Icon (Light)</title>
  <desc>Dash medical device management platform — data network node grid icon, light variant</desc>
  <!-- Background -->
  <rect x="1" y="1" width="78" height="78" rx="14" fill="#ffffff"/>
  <rect x="1" y="1" width="78" height="78" rx="14" fill="none" stroke="#005f8a" stroke-width="1" stroke-opacity="0.25"/>
  <!-- Connecting lines — diagonals -->
  <line x1="15" y1="15" x2="40" y2="40" stroke="#005f8a" stroke-width="0.8" stroke-opacity="0.18"/>
  <line x1="65" y1="15" x2="40" y2="40" stroke="#005f8a" stroke-width="0.8" stroke-opacity="0.18"/>
  <line x1="15" y1="65" x2="40" y2="40" stroke="#005f8a" stroke-width="0.8" stroke-opacity="0.18"/>
  <line x1="65" y1="65" x2="40" y2="40" stroke="#005f8a" stroke-width="0.8" stroke-opacity="0.18"/>
  <!-- Connecting lines — horizontal -->
  <line x1="15" y1="15" x2="65" y2="15" stroke="#005f8a" stroke-width="0.8" stroke-opacity="0.22"/>
  <line x1="15" y1="40" x2="65" y2="40" stroke="#005f8a" stroke-width="0.8" stroke-opacity="0.22"/>
  <line x1="15" y1="65" x2="65" y2="65" stroke="#005f8a" stroke-width="0.8" stroke-opacity="0.22"/>
  <!-- Connecting lines — vertical -->
  <line x1="15" y1="15" x2="15" y2="65" stroke="#005f8a" stroke-width="0.8" stroke-opacity="0.22"/>
  <line x1="40" y1="15" x2="40" y2="65" stroke="#005f8a" stroke-width="0.8" stroke-opacity="0.22"/>
  <line x1="65" y1="15" x2="65" y2="65" stroke="#005f8a" stroke-width="0.8" stroke-opacity="0.22"/>
  <!-- Nodes — outer corners (dim) -->
  <circle cx="15" cy="65" r="3" fill="#005f8a" fill-opacity="0.4"/>
  <circle cx="65" cy="65" r="3" fill="#005f8a" fill-opacity="0.4"/>
  <!-- Nodes — active corners -->
  <circle cx="15" cy="15" r="4" fill="#005f8a" fill-opacity="0.85"/>
  <circle cx="65" cy="15" r="4" fill="#005f8a" fill-opacity="0.85"/>
  <!-- Nodes — edge midpoints -->
  <circle cx="40" cy="15" r="3" fill="#005f8a" fill-opacity="0.5"/>
  <circle cx="15" cy="40" r="3" fill="#005f8a" fill-opacity="0.5"/>
  <circle cx="65" cy="40" r="3" fill="#005f8a" fill-opacity="0.5"/>
  <circle cx="40" cy="65" r="3" fill="#005f8a" fill-opacity="0.5"/>
  <!-- Center node -->
  <circle cx="40" cy="40" r="5.5" fill="#005f8a"/>
  <circle cx="40" cy="40" r="8.5" fill="none" stroke="#005f8a" stroke-width="0.8" stroke-opacity="0.3"/>
</svg>
