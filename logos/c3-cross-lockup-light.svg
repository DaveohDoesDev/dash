    <circle cx="40" cy="68" r="3" fill="#ffffff"/>
    <circle cx="40" cy="68" r="3" fill="none" stroke="#00875a" stroke-width="1.5"/>
    <circle cx="12" cy="40" r="3" fill="#ffffff"/>
    <circle cx="12" cy="40" r="3" fill="none" stroke="#00875a" stroke-width="1.5"/>
    <circle cx="68" cy="40" r="3" fill="#ffffff"/>
