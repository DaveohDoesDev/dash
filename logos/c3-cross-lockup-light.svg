    <linearGradient id="lk3l-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#005f8a"/>
      <stop offset="100%" stop-color="#007a6a"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="300" height="80" fill="#ffffff"/>
  <!-- Icon group -->
  <g transform="translate(0,0)">
    <circle cx="40" cy="40" r="38" fill="#ffffff"/>
    <circle cx="40" cy="40" r="38" fill="none" stroke="#005f8a" stroke-width="1" stroke-opacity="0.2"/>
    <rect x="11" y="29" width="58" height="22" rx="5" fill="url(#lk3l-grad)"/>
    <rect x="29" y="11" width="22" height="58" rx="5" fill="url(#lk3l-grad)"/>
    <circle cx="40" cy="12" r="3" fill="#ffffff"/>
