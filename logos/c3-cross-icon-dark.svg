<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80">
  <title>Dash — Medical Cross Icon (Dark)</title>
  <desc>Dash medical device management platform — medical cross with tech accents, dark variant</desc>
  <defs>
    <linearGradient id="cross-grad-d" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#00a896"/>
    </linearGradient>
    <filter id="cross-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Background circle -->
  <circle cx="40" cy="40" r="38" fill="#040d1a"/>
  <circle cx="40" cy="40" r="38" fill="none" stroke="#00d4ff" stroke-width="1" stroke-opacity="0.25"/>
  <!-- Cross — horizontal bar -->
  <rect x="11" y="29" width="58" height="22" rx="5" fill="url(#cross-grad-d)" filter="url(#cross-glow)"/>
  <!-- Cross — vertical bar -->
  <rect x="29" y="11" width="22" height="58" rx="5" fill="url(#cross-grad-d)" filter="url(#cross-glow)"/>
  <!-- Circuit dots at arm ends -->
  <circle cx="40" cy="12" r="3" fill="#040d1a"/>
  <circle cx="40" cy="12" r="3" fill="none" stroke="#00ff88" stroke-width="1.5"/>
  <circle cx="40" cy="68" r="3" fill="#040d1a"/>
  <circle cx="40" cy="68" r="3" fill="none" stroke="#00ff88" stroke-width="1.5"/>
  <circle cx="12" cy="40" r="3" fill="#040d1a"/>
  <circle cx="12" cy="40" r="3" fill="none" stroke="#00ff88" stroke-width="1.5"/>
  <circle cx="68" cy="40" r="3" fill="#040d1a"/>
  <circle cx="68" cy="40" r="3" fill="none" stroke="#00ff88" stroke-width="1.5"/>
  <!-- Center highlight -->
  <circle cx="40" cy="40" r="4" fill="#040d1a" fill-opacity="0.5"/>
  <circle cx="40" cy="40" r="4" fill="none" stroke="#ffffff" stroke-width="0.8" stroke-opacity="0.4"/>
</svg>
