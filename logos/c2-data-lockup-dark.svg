<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 80" width="300" height="80">
  <title>Dash — Data Network Lockup (Dark)</title>
  <desc>Dash medical device management platform — data network concept full lockup, dark variant</desc>
  <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=Outfit:wght@800&amp;family=JetBrains+Mono:wght@300&amp;display=swap');</style>
    <filter id="lk2-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Icon group -->
  <g transform="translate(0,0)">
    <rect x="1" y="1" width="78" height="78" rx="14" fill="#040d1a"/>
    <rect x="1" y="1" width="78" height="78" rx="14" fill="none" stroke="#00d4ff" stroke-width="1" stroke-opacity="0.25"/>
    <line x1="15" y1="15" x2="40" y2="40" stroke="#00d4ff" stroke-width="0.8" stroke-opacity="0.18"/>
    <line x1="65" y1="15" x2="40" y2="40" stroke="#00d4ff" stroke-width="0.8" stroke-opacity="0.18"/>
    <line x1="15" y1="65" x2="40" y2="40" stroke="#00d4ff" stroke-width="0.8" stroke-opacity="0.18"/>
    <line x1="65" y1="65" x2="40" y2="40" stroke="#00d4ff" stroke-width="0.8" stroke-opacity="0.18"/>
    <line x1="15" y1="15" x2="65" y2="15" stroke="#00d4ff" stroke-width="0.8" stroke-opacity="0.2"/>
    <line x1="15" y1="40" x2="65" y2="40" stroke="#00d4ff" stroke-width="0.8" stroke-opacity="0.2"/>
    <line x1="15" y1="65" x2="65" y2="65" stroke="#00d4ff" stroke-width="0.8" stroke-opacity="0.2"/>
    <line x1="15" y1="15" x2="15" y2="65" stroke="#00d4ff" stroke-width="0.8" stroke-opacity="0.2"/>
    <line x1="40" y1="15" x2="40" y2="65" stroke="#00d4ff" stroke-width="0.8" stroke-opacity="0.2"/>
    <line x1="65" y1="15" x2="65" y2="65" stroke="#00d4ff" stroke-width="0.8" stroke-opacity="0.2"/>
    <circle cx="15" cy="65" r="3" fill="#00d4ff" fill-opacity="0.4"/>
    <circle cx="65" cy="65" r="3" fill="#00d4ff" fill-opacity="0.4"/>
    <circle cx="15" cy="15" r="4" fill="#00d4ff" fill-opacity="0.85"/>
    <circle cx="65" cy="15" r="4" fill="#00d4ff" fill-opacity="0.85"/>
    <circle cx="40" cy="15" r="3" fill="#00d4ff" fill-opacity="0.5"/>
    <circle cx="15" cy="40" r="3" fill="#00d4ff" fill-opacity="0.5"/>
    <circle cx="65" cy="40" r="3" fill="#00d4ff" fill-opacity="0.5"/>
    <circle cx="40" cy="65" r="3" fill="#00d4ff" fill-opacity="0.5"/>
    <circle cx="40" cy="40" r="5.5" fill="#00d4ff" filter="url(#lk2-glow)"/>
    <circle cx="40" cy="40" r="8.5" fill="none" stroke="#00d4ff" stroke-width="0.8" stroke-opacity="0.25"/>
  </g>
  <!-- Wordmark -->
  <text x="96" y="46"
    font-family="Outfit, sans-serif" font-weight="800" font-size="34"
    fill="#e8f4fc" letter-spacing="5">DASH</text>
  <!-- Tagline -->
  <text x="97" y="62"
    font-family="'JetBrains Mono', monospace" font-weight="300" font-size="8"
    fill="#3a6b8a" letter-spacing="2.8">MEDICAL DEVICE MANAGEMENT</text>
  <line x1="91" y1="20" x2="91" y2="60" stroke="#00d4ff" stroke-width="0.8" stroke-opacity="0.25"/>
</svg>
